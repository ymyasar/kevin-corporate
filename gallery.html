<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Image Review Gallery — Kevin Nguyen Headshots</title>
<style>
body { font-family: monospace; font-size: 13px; background: #f0f0f0; color: #222; margin: 0; padding: 24px; }
h1 { font-size: 16px; margin: 0 0 6px; }
p { margin: 0 0 20px; color: #555; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.item { background: #fff; border: 1px solid #ddd; }
.item img { width: 100%; height: 240px; object-fit: cover; object-position: center top; display: block; }
.item .meta { padding: 8px 10px; }
.item .idx { font-weight: bold; color: #000; }
.item .fname { color: #555; word-break: break-all; }
</style>
<script src="/images-manifest.js"></script>
</head>
<body>

<h1>Image Review Gallery</h1>
<p>REVIEW BEFORE PUBLISHING — 21 images from /images. Confirm every face is Kevin's real client work before going live.</p>

<div class="grid" id="grid"></div>

<script>
(function(){
  var grid = document.getElementById('grid');
  if(!window.KEVIN_IMAGES || !window.KEVIN_IMAGES.length){
    grid.textContent = 'ERROR: window.KEVIN_IMAGES not loaded. Serve this file over HTTP (not file://).';
    return;
  }
  window.KEVIN_IMAGES.forEach(function(img, i){
    var item = document.createElement('div');
    item.className = 'item';

    var el = document.createElement('img');
    el.src = img.src;
    el.alt = img.alt;
    el.loading = 'lazy';

    var meta = document.createElement('div');
    meta.className = 'meta';

    var idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = 'Index ' + i;

    var fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = img.src.split('/').pop();

    var dims = document.createElement('div');
    dims.style.color = '#888';
    dims.textContent = img.w + ' × ' + img.h + ' · ' + img.orientation;

    meta.appendChild(idx);
    meta.appendChild(fname);
    meta.appendChild(dims);
    item.appendChild(el);
    item.appendChild(meta);
    grid.appendChild(item);
  });
})();
</script>

</body>
</html>
